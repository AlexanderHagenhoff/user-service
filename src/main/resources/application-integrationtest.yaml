spring:
  datasource:
    url: jdbc:tc:postgresql:16.3:///user-service?currentSchema=user-service
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  flyway:
    enabled: true
    default-schema: user-service
    schemas: user-service
    create-schemas: true
    locations: ['classpath:db/migration']
  jpa:
    hibernate:
      ddl-auto: none

client:
  config:
    path: notsecretfortest/test-clients.yaml

