spring:
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: user-service
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: user-service
  output:
    ansi:
      enabled: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:8080/oauth2/jwks

server:
  port: 8080
  ssl:
    enabled: false
  tomcat:
    accesslog:
      enabled: true
      directory: log
      pattern: '%h %l %u [%t] "%r" %s %b "%{Referer}i" "%{User-Agent}i" %D [%I] "%{Host}i"'

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.security: trace

